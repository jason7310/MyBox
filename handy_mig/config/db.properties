# ====================================================================
# [통합 MIG] Tibero 7 데이터베이스 접속 및 마이그레이션 설정 파일
# ====================================================================

# 1. Tibero 7 JDBC 드라이버 클래스
db.driver=com.tmax.tibero.jdbc.TbDriver

# 2. JDBC 접속 URL (Tibero 7 TAC 2-node 환경)
# 주의: TAC 환경에서는 배치 작업 간 노드 간 블록 전송(Interconnect) 경합을 줄이기 위해
#       특정 단일 노드(VIP)로 접속하는 것을 강력히 권장합니다.
# 형식: jdbc:tibero:thin:@<IP>:<PORT>:<SID>
#db.url=jdbc:tibero:thin:@192.168.204.209:8629:tibero
db.url=jdbc:tibero:thin:@192.168.204.209:9410:tibero

# 3. 데이터베이스 인증 정보
#db.username=INTRAWARE
#db.password=intraware
db.username=sys
db.password=tibero

# 4. 스키마 환경 설정
schema.target=INTRAWARE
schema.source=MIG1_USER
schema.asis=APP_USER

# 5. 마이그레이션 튜닝 옵션
# 병렬 처리도 (Parallel Degree)
mig.parallel.degree=16

# 배치 Fetch / Commit 단위 (건수)
mig.batch.size=10000

# 6. 파일 스토리지 경로 설정
# 핸디 그룹웨어 결재 첨부파일 저장소 루트 경로
storage.base.path=~/hoffice/sancbox/
